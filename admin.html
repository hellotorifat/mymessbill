<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Super Admin — mymessbill</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10201d;--mute:#5b6b66;--line:#dce6e1;--pri:#0b6b5c;--soft:#e0f1ec;--bad:#d23f2c;--acc:#f4a300}
@media (prefers-color-scheme:dark){:root{--bg:#0b1513;--card:#13211e;--ink:#e6f0ed;--mute:#9bb0a9;--line:#233431;--pri:#4fd1b5;--soft:#173833;--bad:#ff8a77}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Hind Siliguri","Noto Sans Bengali",sans-serif;padding:14px;max-width:1040px;margin:auto}
h1{margin:0 0 4px;font-size:22px}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}.mute{color:var(--mute);font-size:13px}.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,button,select,textarea{font:inherit;border-radius:10px;border:1.5px solid var(--line);padding:8px 11px;background:var(--card);color:inherit}input,select,textarea{width:100%}button{cursor:pointer;font-weight:600;white-space:nowrap}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.x{color:var(--bad)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1 1 140px;width:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kp div{background:var(--soft);border-radius:14px;padding:10px 12px}.kp small{display:block;color:var(--mute);font-size:12px}.kp b{font-size:24px;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px}.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{border-radius:20px}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.st{font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px}.st.pending{background:#fff2d2;color:#6b4600}.st.approved{background:var(--soft);color:var(--pri)}.st.rejected{background:#fde9e5;color:var(--bad)}
.qr{width:90px;height:90px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.warn{background:#fff2d2;color:#6b4600;border:1px solid #f0d28a;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}.bad{color:var(--bad);font-weight:700}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}.dot{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
</style></head><body>
<h1>🛡 Super Admin</h1><div class="mute">mymessbill • শুধু মালিকের জন্য • মেসের ভেতরের হিসাব/সদস্য/চ্যাট এনক্রিপ্টেড, এখানে দেখা যায় না</div>
<div class="box" id="lg"><div class="row"><input id="k" type="password" placeholder="অ্যাডমিন কী (ADMIN_KEY)" autocomplete="current-password"><button class="p" id="go">ঢুকুন</button></div><p class="mute" id="m"></p></div>
<div id="app" hidden>
 <div class="tabs" id="tabs"><button data-t="ov" class="on">📊 ওভারভিউ</button><button data-t="ms">🏠 মেস</button><button data-t="pay">💳 পেমেন্ট<span class="dot" id="pb" hidden></span></button><button data-t="rv">💰 আয়</button><button data-t="mt">🧾 পদ্ধতি ও QR</button><button data-t="pl">📦 প্ল্যান ও সেটিং</button><button id="out">বের হন</button></div>
 <div id="v"></div>
</div>
<script>
const $=id=>document.getElementById(id);let K="",T="ov",D={list:[],total:0},CFG=null,ST={},PAYS=[],SUM={members:0,paid:0,exp:[]},RECENT=[],WARN={},PG=30;try{K=sessionStorage.getItem("bpAdm")||""}catch(e){}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=t=>t?new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const bn=n=>Number(n||0).toLocaleString("en-IN");
async function call(m,q,body){const r=await fetch("/api/admin"+(q||""),{method:m,headers:Object.assign({"x-admin-key":K},body?{"content-type":"application/json"}:{}),body:body?JSON.stringify(body):undefined,cache:"no-store"});const j=await r.json().catch(()=>({}));return{r,j}}
const post=b=>call("POST","",b);
async function loadMess(sum){const q="?limit="+PG+"&offset="+(ST.off||0)+(ST.q?"&q="+encodeURIComponent(ST.q):"")+(sum?"&sum=1":"");const x=await call("GET",q);if(x.r.ok){D=x.j;if(x.j.sum)SUM=x.j.sum}return x}
async function loadAll(){
  $("m").textContent="লোড হচ্ছে…";let x;ST.off=0;try{x=await loadMess(true)}catch(e){$("m").textContent="সংযোগ নেই";return}
  if(x.r.status===429&&x.j.error==="locked"){$("lg").hidden=false;$("app").hidden=true;$("m").textContent="অনেকবার ভুল কী দেওয়া হয়েছে — ১৫ মিনিট পরে আবার চেষ্টা করুন";return}
  if(x.r.status===403){K="";try{sessionStorage.removeItem("bpAdm")}catch(e){}$("lg").hidden=false;$("app").hidden=true;$("m").textContent="কী মেলেনি";return}
  if(!x.r.ok){$("lg").hidden=false;$("m").textContent=x.j.error==="admin_not_configured"?"Vercel-এ ADMIN_KEY (কমপক্ষে ৮ অক্ষর) সেট করে Redeploy করুন":"সমস্যা: "+(x.j.error||x.r.status);return}
  try{sessionStorage.setItem("bpAdm",K)}catch(e){}
  RECENT=D.list.slice(0,5);const [c,p]=await Promise.all([post({a:"cfgget"}),post({a:"pays"})]);CFG=c.j.cfg;ST.stats=c.j.stats||{};WARN=c.j.warn||{};PAYS=p.j.list||[];
  $("lg").hidden=true;$("app").hidden=false;const pe=PAYS.filter(x=>x.st==="pending").length;$("pb").hidden=!pe;$("pb").textContent=pe;draw()}
function draw(){document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===T));$("v").innerHTML=({ov,ms,pay,rv,mt,pl}[T])()}
function ov(){const S2=ST.stats||{};
  const warn=(WARN.weakKey?'<div class="warn">⚠ আপনার ADMIN_KEY ১২ অক্ষরের কম। Vercel-এ আরও লম্বা ও এলোমেলো কী দিন (কমপক্ষে ১২, ভালো হয় ২০+), তারপর Redeploy করুন।</div>':"")+(WARN.noSecret?'<div class="warn">⚠ SERVER_SECRET সেট করা নেই। তাই Google-লিংক করা কোড ডেটাবেস টোকেন থেকে এনক্রিপ্ট হচ্ছে। Vercel-এ লম্বা এলোমেলো SERVER_SECRET দিন। (একবার দিলে আর বদলাবেন না; এখন দিলে আগে লিংক করা Google লগইন আবার লিংক করতে হবে।)</div>':"");
  return `${warn}<div class="box"><div class="kp"><div><small>মোট মেস</small><b>${D.total}</b></div><div><small>মোট সদস্য (জানা)</small><b>${bn(SUM.members)}</b></div><div><small>পেইড মেস</small><b>${SUM.paid}</b></div><div><small>অপেক্ষায় পেমেন্ট</small><b>${S2.pending||0}</b></div><div><small>অনুমোদিত পেমেন্ট</small><b>${S2.approved||0}</b></div><div><small>মোট আয় (৳)</small><b>${bn(S2.revenue)}</b></div></div>${SUM.capped?'<p class="mute">মেস ১০০০-এর বেশি, তাই সদস্য/পেইড হিসাব প্রথম ১০০০টি থেকে।</p>':""}</div>
  <div class="box"><h2>সর্বশেষ মেস</h2>${tbl(RECENT,0)}</div>`}
function tbl(L,st){st=st||0;return `<div class="scroll"><table><thead><tr><th>#</th><th>মেসের নাম</th><th>তৈরি</th><th>আপডেট</th><th>সদস্য</th><th>প্রকাশ</th><th>কোড</th><th>মেসেজ</th><th></th></tr></thead><tbody>${L.map((v,i)=>`<tr><td>${st+i+1}</td><td><b>${esc(v.name||"(নাম নেই)")}</b><div class="mute">${esc(v.id)}</div></td><td>${dt(v.cat)}</td><td>${dt(v.uat)}</td><td>${v.mc==null?"—":v.mc} / ${v.lim}${v.until?`<div class="mute">${dt(v.until)} পর্যন্ত</div>`:""}</td><td>v${v.ver}<div class="mute${v.size>700000?" bad":""}">${Math.round((v.size||0)/1024)} KB</div></td><td>${v.codes}</td><td>${v.chat}/${v.ev}</td><td><button data-lim="${esc(v.id)}">সীমা</button> <button class="x" data-del="${esc(v.id)}" data-n="${esc(v.name)}">মুছুন</button></td></tr>`).join("")||'<tr><td colspan="9">কোনো মেস নেই</td></tr>'}</tbody></table></div>`}
function ms(){const off=ST.off||0,to=Math.min(off+PG,D.total);
  return `<div class="box"><div class="row"><input id="sq" placeholder="মেসের নাম / আইডি খুঁজুন" value="${esc(ST.q||"")}"><button id="rf">🔄 রিফ্রেশ</button></div>${tbl(D.list,off)}
  <div class="row" style="margin-top:8px;justify-content:space-between"><button data-pg="-1"${off<=0?" disabled":""}>← আগের</button><span class="mute">${D.total?off+1:0}–${to} / ${D.total}</span><button data-pg="1"${to>=D.total?" disabled":""}>পরের →</button></div>
  <p class="mute">"সীমা" দিয়ে কোনো মেসকে হাতে সদস্য সীমা দিতে পারবেন (যেমন ফ্রি/উপহার)। 0 দিলে হাতে দেওয়া সীমা মুছে যায়। "প্রকাশ" ঘরের KB হলো ডেটার আকার (সীমা ৮৭৯ KB; লাল হলে মেস সীমার কাছাকাছি)।</p></div>`}
function pay(){const f=ST.pf||"pending",L=PAYS.filter(p=>f==="all"||p.st===f);
  return `<div class="box"><div class="row"><select id="pf"><option value="pending"${f==="pending"?" selected":""}>অপেক্ষায়</option><option value="approved"${f==="approved"?" selected":""}>অনুমোদিত</option><option value="rejected"${f==="rejected"?" selected":""}>বাতিল</option><option value="all"${f==="all"?" selected":""}>সব</option></select><button id="csv">⬇ CSV</button></div>
  <div class="scroll"><table><thead><tr><th>সময়</th><th>মেস</th><th>প্ল্যান</th><th>৳</th><th>পদ্ধতি</th><th>প্রেরক / TrxID</th><th>অবস্থা</th><th></th></tr></thead><tbody>${L.map(p=>`<tr><td>${dt(p.at)}</td><td><b>${esc(p.mname||"—")}</b><div class="mute">${esc(p.mid)}</div></td><td>${esc(p.plan.name)}<div class="mute">${p.plan.limit} জন${p.plan.days?" • "+p.plan.days+" দিন":""}</div></td><td>${bn(p.amount)}</td><td>${esc(p.method.name)}</td><td>${esc(p.sender)}<div><b>${esc(p.trx)}</b></div></td><td><span class="st ${p.st}">${p.st==="pending"?"অপেক্ষায়":p.st==="approved"?"অনুমোদিত":"বাতিল"}</span>${p.note?`<div class="mute">${esc(p.note)}</div>`:""}</td><td>${p.st==="pending"?`<button class="p" data-pa="approve" data-id="${esc(p.id)}">✔ অনুমোদন</button> <button class="x" data-pa="reject" data-id="${esc(p.id)}">✕ বাতিল</button>`:""}</td></tr>`).join("")||'<tr><td colspan="8">কিছু নেই</td></tr>'}</tbody></table></div>
  <p class="mute">bKash/Nagad অ্যাপে TrxID ও পরিমাণ মিলিয়ে তারপর অনুমোদন দিন। একই TrxID দ্বিতীয়বার নেওয়া হয় না।</p></div>`}
function rv(){const A=PAYS.filter(p=>p.st==="approved"),S2=ST.stats||{},tot=S2.revenue!=null?S2.revenue:A.reduce((s,p)=>s+(+p.amount||0),0),cnt=S2.approved!=null?S2.approved:A.length;
  const grp=(key)=>{const m={};A.forEach(p=>{const k=key(p);m[k]=m[k]||{n:0,t:0};m[k].n++;m[k].t+=+p.amount||0});return Object.entries(m).sort((a,b)=>a[0]<b[0]?1:-1)};
  const mon=grp(p=>{const d=new Date(p.at);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}),me=grp(p=>p.method.name),pl=grp(p=>p.plan.name);
  const T2=(h,L)=>`<div class="scroll"><table><thead><tr><th>${h}</th><th>পেমেন্ট</th><th>৳</th></tr></thead><tbody>${L.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1].n}</td><td><b>${bn(x[1].t)}</b></td></tr>`).join("")||'<tr><td colspan="3">কিছু নেই</td></tr>'}</tbody></table></div>`;
  const now=Date.now(),soon=(SUM.exp||[]).filter(v=>v.until>now&&v.until-now<7*864e5),gone=(SUM.exp||[]).filter(v=>v.until<=now);
  const L2=(L)=>L.length?`<div class="scroll"><table><thead><tr><th>মেস</th><th>সীমা</th><th>মেয়াদ</th></tr></thead><tbody>${L.map(v=>`<tr><td><b>${esc(v.name||"—")}</b><div class="mute">${esc(v.id)}</div></td><td>${v.lim}</td><td>${dt(v.until)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="mute">কেউ নেই</p>';
  return `<div class="box"><div class="kp"><div><small>মোট আয় (৳)</small><b>${bn(tot)}</b></div><div><small>অনুমোদিত পেমেন্ট</small><b>${cnt}</b></div><div><small>গড় পেমেন্ট (৳)</small><b>${cnt?bn(Math.round(tot/cnt)):0}</b></div></div><div class="row" style="margin-top:8px"><button id="csv2">⬇ মাসিক আয় CSV</button></div></div>
  <div class="box"><h2>📅 মাসভিত্তিক আয়</h2>${T2("মাস",mon)}</div>
  <div class="box"><h2>🧾 পদ্ধতিভেদে</h2>${T2("পদ্ধতি",me)}</div>
  <div class="box"><h2>📦 প্ল্যানভেদে</h2>${T2("প্ল্যান",pl)}</div>
  <div class="box"><h2>⏳ ৭ দিনের মধ্যে মেয়াদ শেষ</h2>${L2(soon)}</div>
  <div class="box"><h2>⌛ মেয়াদ শেষ হয়েছে</h2>${L2(gone)}</div>
  <p class="mute">সময়সীমার প্ল্যান না থাকলে (মেয়াদ ০) এই দুই তালিকা ফাঁকা থাকবে। আয় ধরা হয় শুধু অনুমোদিত পেমেন্ট থেকে। উপরের মোট সংখ্যা সব পেমেন্টের; নিচের মাস/পদ্ধতি/প্ল্যান ভাগ শুধু সর্বশেষ ৩০০ পেমেন্ট থেকে।</p>`}
function mt(){return `<div class="box"><h2>🧾 পেমেন্ট পদ্ধতি (বিকাশ, নগদ, রকেট, ব্যাংক…)</h2><p class="mute">চালু থাকা পদ্ধতি ম্যানেজাররা দেখবে। QR ছবি আপলোড করা যায়।</p>
  ${(CFG.methods||[]).map(m=>`<div class="box" data-mid="${esc(m.id)}"><div class="g2"><div><label class="mute">নাম</label><input data-f="name" value="${esc(m.name)}" maxlength="30"></div><div><label class="mute">নম্বর / অ্যাকাউন্ট</label><input data-f="num" value="${esc(m.num)}" maxlength="60"></div><div><label class="mute">নোট (যেমন: Send Money / Personal)</label><input data-f="note" value="${esc(m.note)}" maxlength="200"></div></div>
  <div class="row" style="margin-top:8px">${m.q?`<img class="qr" src="/api/pay?qr=${encodeURIComponent(m.id)}&v=${m.q}" alt="QR">`:'<span class="mute">QR নেই</span>'}<input type="file" accept="image/*" data-qr style="max-width:230px">${m.q?'<button class="x" data-qrdel>QR সরান</button>':""}<label><input type="checkbox" data-f="on" ${m.on?"checked":""} style="width:auto"> চালু</label><button class="p" data-msave>সেভ</button><button class="x" data-mdel>মুছুন</button></div></div>`).join("")||'<p class="mute">এখনো কোনো পদ্ধতি নেই।</p>'}
  <h3>➕ নতুন পদ্ধতি</h3><div class="row"><select id="nmq"><option>বিকাশ</option><option>নগদ</option><option>রকেট</option><option>উপায়</option><option>ব্যাংক</option><option>অন্য</option></select><input id="nmn" placeholder="নম্বর / অ্যাকাউন্ট"><button class="p" id="nma">যোগ করুন</button></div></div>`}
function pl(){const c=CFG;return `<div class="box"><h2>📦 প্ল্যান</h2><p class="mute">ফ্রি সীমার বেশি সদস্য লাগলে ম্যানেজার এই প্ল্যান কিনবে। "দিন" 0 মানে একবার কিনলেই সারাজীবন।</p>
  <div class="row"><label>ফ্রি সদস্য সীমা</label><input id="free" type="number" min="1" value="${c.free}" style="max-width:100px"></div>
  <div class="scroll"><table><thead><tr><th>প্ল্যানের নাম</th><th>সদস্য সীমা</th><th>দাম ৳</th><th>দিন (০=একবার)</th><th></th></tr></thead><tbody id="plb">${c.plans.map(p=>planRow(p)).join("")}</tbody></table></div><button id="pladd">➕ প্ল্যান যোগ</button></div>
  <div class="box"><h2>📣 সাইট নোটিশ</h2><p class="mute">সব ইউজারের হোম/লগইন পেজের ওপরে দেখাবে (ফাঁকা রাখলে কিছু দেখাবে না)।</p><textarea id="notice" rows="2" maxlength="300">${esc(c.notice)}</textarea>
  <h3>☎ সাপোর্ট / যোগাযোগ (পেমেন্ট পেজে দেখাবে)</h3><input id="support" maxlength="200" value="${esc(c.support)}" placeholder="যেমন: WhatsApp 01XXXXXXXXX">
  <div class="row" style="margin-top:10px"><button class="p" id="plsave">💾 সব সেভ করুন</button></div></div>`}
const planRow=p=>`<tr><td><input data-pf="name" value="${esc(p.name)}" maxlength="40"></td><td><input data-pf="limit" type="number" min="1" value="${p.limit}"><input type="hidden" data-pf="id" value="${esc(p.id)}"></td><td><input data-pf="price" type="number" min="0" value="${p.price}"></td><td><input data-pf="days" type="number" min="0" value="${p.days||0}"></td><td><button class="x" data-plrm>✕</button></td></tr>`;
function resizeQR(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const n=Math.min(480,Math.max(im.width,im.height)),k=n/Math.max(im.width,im.height),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$("go").onclick=()=>{K=$("k").value;loadAll()};$("k").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>{K="";try{sessionStorage.removeItem("bpAdm")}catch(e){}location.reload()};
$("tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b){T=b.dataset.t;draw()}};
const v=$("v");
v.onclick=async e=>{const t=e.target;
  if(t.id==="rf"){loadAll();return}
  const pg=t.closest("[data-pg]");if(pg){ST.off=Math.max(0,(ST.off||0)+(+pg.dataset.pg)*PG);await loadMess();draw();return}
  if(t.id==="csv2"){const m={};PAYS.filter(p=>p.st==="approved").forEach(p=>{const d=new Date(p.at),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");m[k]=m[k]||[0,0];m[k][0]++;m[k][1]+=+p.amount||0});const rows=[["month","payments","revenue"]].concat(Object.entries(m).sort().map(([k,v])=>[k,v[0],v[1]]));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="revenue.csv";a.click();return}
  if(t.id==="csv"){const rows=[["time","mess","plan","limit","amount","method","sender","trx","status","note"]].concat(PAYS.map(p=>[new Date(p.at).toISOString(),p.mname,p.plan.name,p.plan.limit,p.amount,p.method.name,p.sender,p.trx,p.st,p.note||""]));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));a.download="payments.csv";a.click();return}
  const del=t.closest("[data-del]");if(del){const n=del.dataset.n||del.dataset.del;if(prompt("⚠ এই মেস চিরতরে মুছে যাবে (ডেটা, কোড, চ্যাট)। নিশ্চিত হতে মেসের নাম লিখুন:\n"+n)!==n)return;const x=await call("DELETE","?id="+encodeURIComponent(del.dataset.del));if(x.r.ok)loadAll();else alert("মোছা যায়নি: "+(x.j.error||x.r.status));return}
  const lim=t.closest("[data-lim]");if(lim){const a=prompt("কত জন পর্যন্ত সীমা দেবেন? (0 = হাতে দেওয়া সীমা মুছুন)");if(a===null)return;const d=prompt("কত দিনের জন্য? (0 = সারাজীবন)","0");if(d===null)return;const x=await post({a:"ent",id:lim.dataset.lim,limit:+a,days:+d});if(x.r.ok)loadAll();else alert("হয়নি: "+(x.j.error||x.r.status));return}
  const pa=t.closest("[data-pa]");if(pa){const act=pa.dataset.pa,note=prompt(act==="approve"?"নোট (ঐচ্ছিক):":"বাতিলের কারণ (ম্যানেজার দেখবে):","")??null;if(note===null)return;if(act==="approve"&&!confirm("TrxID ও টাকা মিলিয়ে দেখেছেন? অনুমোদন দিলে সীমা সাথে সাথে বাড়বে।"))return;const x=await post({a:"payact",id:pa.dataset.id,act,note});if(x.r.ok)loadAll();else alert("হয়নি: "+(x.j.error||x.r.status));return}
  const box=t.closest("[data-mid]");
  if(t.dataset.msave!==undefined&&box){const g=f=>box.querySelector(`[data-f=${f}]`);const x=await post({a:"method",method:{id:box.dataset.mid,name:g("name").value,num:g("num").value,note:g("note").value,on:g("on").checked}});if(x.r.ok){toast("সেভ হয়েছে");loadAll()}else alert("হয়নি: "+(x.j.error||x.r.status));return}
  if(t.dataset.mdel!==undefined&&box){if(!confirm("এই পদ্ধতি মুছবেন?"))return;const x=await post({a:"mdel",id:box.dataset.mid});if(x.r.ok)loadAll();return}
  if(t.dataset.qrdel!==undefined&&box){const m=CFG.methods.find(z=>z.id===box.dataset.mid);const x=await post({a:"method",method:m,qr:null});if(x.r.ok)loadAll();return}
  if(t.id==="nma"){const nm=$("nmq").value,num=$("nmn").value;const x=await post({a:"method",method:{name:nm,num,note:"",on:true}});if(x.r.ok)loadAll();else alert("হয়নি: "+(x.j.error||x.r.status));return}
  if(t.id==="pladd"){$("plb").insertAdjacentHTML("beforeend",planRow({id:"",name:"",limit:(CFG.free||15)+10,price:0,days:0}));return}
  if(t.dataset.plrm!==undefined){t.closest("tr").remove();return}
  if(t.id==="plsave"){const plans=[...document.querySelectorAll("#plb tr")].map(tr=>{const g=f=>tr.querySelector(`[data-pf=${f}]`).value;return{id:g("id"),name:g("name"),limit:g("limit"),price:g("price"),days:g("days")}});
    const x=await post({a:"cfg",free:$("free").value,plans,notice:$("notice").value,support:$("support").value});if(x.r.ok){toast("সেভ হয়েছে");loadAll()}else alert("হয়নি: "+(x.j.error||x.r.status));return}};
v.onchange=async e=>{const t=e.target;
  if(t.id==="pf"){ST.pf=t.value;draw();return}
  if(t.dataset.qr!==undefined&&t.files[0]){const box=t.closest("[data-mid]"),m=CFG.methods.find(z=>z.id===box.dataset.mid);try{const d=await resizeQR(t.files[0]);const x=await post({a:"method",method:m,qr:d});if(x.r.ok){toast("QR আপলোড হয়েছে");loadAll()}else alert("আপলোড হয়নি: "+(x.j.error||x.r.status))}catch(er){alert("ছবি পড়া যায়নি")}}};
let sqT=0;v.oninput=e=>{if(e.target.id==="sq"){ST.q=e.target.value;ST.off=0;clearTimeout(sqT);sqT=setTimeout(async()=>{const p=e.target.selectionStart;await loadMess();draw();const i=$("sq");if(i){i.focus();i.setSelectionRange(p,p)}},350)}};
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10201d;color:#fff;padding:10px 16px;border-radius:12px;z-index:9";document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
if(K)loadAll();
</script></body></html>
