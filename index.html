/* ---------- charts ---------- */
function chart(title,key,fm){
  const vals=MONTHS.map(k=>{const c=calc(k);return c.active?c[key]:null}),ok=vals.filter(v=>v!=null);
  if(!ok.length)return `<div class="box"><h2>${title}</h2><p class="mute">হিসাব যোগ হলে গ্রাফ দেখা যাবে।</p></div>`;
  const W=640,H=210,l=40,r=14,t=26,b=30,n=vals.length,mx=Math.max(...ok)*1.15||1,x=i=>l+i*(W-l-r)/(n-1),y=v=>t+(H-t-b)*(1-v/mx);
  const P=vals.map((v,i)=>v==null?null:[x(i),y(v),v]).filter(Boolean);
  const grid=[0,.5,1].map(q=>`<line x1="${l}" x2="${W-r}" y1="${y(mx*q)}" y2="${y(mx*q)}" stroke="var(--line)"/><text x="${l-5}" y="${y(mx*q)+3}" font-size="10" text-anchor="end" fill="var(--mute)">${fm(mx*q)}</text>`).join("");
  const xl=MONTHS.map((k,i)=>`<text x="${x(i)}" y="${H-10}" font-size="9" text-anchor="middle" fill="var(--mute)">${SM[+k.slice(5)-1]}</text>`).join("");
  const pts=P.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--pri)"/><text x="${q[0]}" y="${q[1]-9}" font-size="10" text-anchor="middle" fill="var(--ink)">${fm(q[2])}</text>`).join("");
  const lo=Math.min(...ok),hi=Math.max(...ok),at=v=>lab(MONTHS[vals.indexOf(v)]);
  return `<div class="box"><h2>${title}</h2><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${grid}${xl}<polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${P.map(q=>q[0]+","+q[1]).join(" ")}"/>${pts}</svg>
  <p class="mute">সর্বনিম্ন: <b>${fm(lo)}</b> (${at(lo)}) • সর্বোচ্চ: <b>${fm(hi)}</b> (${at(hi)})</p></div>`}


/* ---------- গ্রাফ (বার) ---------- */
function bars(title,rows,fm,note){
  rows=rows.filter(r=>r&&isFinite(r.v));
  if(!rows.length||rows.every(r=>!r.v))return `<div class="box"><h2>${title}</h2><p class="mute">হিসাব যোগ হলে গ্রাফ দেখা যাবে।</p></div>`;
  const W=640,H=220,l=42,r=12,t=26,b=30,n=rows.length,mx=Math.max(...rows.map(q=>q.v))*1.18||1,step=(W-l-r)/n,bw=Math.min(44,step*.64),y=v=>t+(H-t-b)*(1-v/mx),dense=n>14,mxv=Math.max(...rows.map(q=>q.v));
  const grid=[0,.5,1].map(q=>`<line x1="${l}" x2="${W-r}" y1="${y(mx*q)}" y2="${y(mx*q)}" stroke="var(--line)"/><text x="${l-5}" y="${y(mx*q)+3}" font-size="10" text-anchor="end" fill="var(--mute)">${fm(mx*q)}</text>`).join("");
  const bs=rows.map((q,i)=>{const cx=l+step*i+step/2,yy=y(q.v),h=Math.max(q.v>0?2:0,H-b-yy);
    return `<rect x="${cx-bw/2}" y="${H-b-h}" width="${bw}" height="${h}" rx="4" fill="${q.hl?"var(--acc)":"var(--pri)"}"><title>${esc(q.l)}: ${fm(q.v)}</title></rect>${(!dense||q.v===mxv||q.hl)&&q.v>0?`<text x="${cx}" y="${H-b-h-5}" font-size="${dense?8:10}" text-anchor="middle" fill="var(--ink)">${fm(q.v)}</text>`:""}<text x="${cx}" y="${H-11}" font-size="${dense?8:9}" text-anchor="middle" fill="var(--mute)">${esc(q.l)}</text>`}).join("");
  return `<div class="box"><h2>${title}</h2><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${bs}</svg>${note?`<p class="mute">${note}</p>`:""}</div>`}
function dailyMeals(){
  const T=todayK(),k=T.slice(0,7),a=k.split("-").map(Number),dim=new Date(a[0],a[1],0).getDate(),last=+T.slice(8),ids=S.members.filter(b=>isAct(b,k)).map(b=>b.id);
  if(!ids.length)return"";
  const rows=[];let tot=0;for(let d=1;d<=dim;d++){const dt=k+"-"+pad(d);let v=0;if(d<=last)ids.forEach(id=>{v+=mlVal(dt,id)});v=Math.round(v*100)/100;if(d<=last)tot+=v;rows.push({l:bd(d),v,hl:d===last})}
